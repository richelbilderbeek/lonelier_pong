name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: 6.11.3
  # Must match the Qt version, see https://doc.qt.io/qt-6/wasm.html
  EMSCRIPTEN_VERSION: 4.0.7

jobs:
  qt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev
      - name: Build
        run: |
          mkdir build
          cd build
          qmake6 ..
          make -j4
      - name: Smoke test
        run: QT_QPA_PLATFORM=offscreen timeout 3 build/lonelier_pong || [ $? -eq 124 ]
      - uses: actions/upload-artifact@v4
        with:
          name: lonelier_pong-qt
          path: build/lonelier_pong

  webassembly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        # WebAssembly Qt also needs a desktop Qt for its host tools
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$HOME/qt"
          aqt install-qt all_os wasm "$QT_VERSION" wasm_singlethread -O "$HOME/qt"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - name: Build
        run: |
          mkdir build
          cd build
          "$HOME/qt/$QT_VERSION/wasm_singlethread/bin/qmake" ..
          make -j4
      - name: Collect web files
        run: |
          mkdir dist
          cp build/*.html build/*.js build/*.wasm dist/
          cp build/*.svg dist/ || true
      - name: Smoke test in a browser
        run: |
          pip install playwright pillow
          (cd dist && python3 -m http.server 8000) &
          sleep 2
          python3 .github/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: lonelier_pong-webassembly
          path: dist
